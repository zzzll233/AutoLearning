<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>测试运行历史</title>

<h1>测试运行历史</h1>
<table>
  <thead>
    <tr><th>结束时间</th><th>模式</th><th>结果</th></tr>
  </thead>
  <tbody>
    {% for run in runs %}
    <tr>
      <td>{{ run["finished_at"] }}</td>
      <td>{{ run["mode"] }}</td>
      <td>{{ "通过" if run["exit_code"] == 0 else "未通过" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</html>
